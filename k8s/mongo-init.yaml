apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: emi

spec:
  backoffLimit: 10

  template:
    spec:
      restartPolicy: OnFailure

      containers:
        - name: mongo-init
          image: mongo:7.0

          command:
            - /bin/bash
            - -c
            - |
              until mongosh --host mongo-0.mongo:27017 --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
                echo "Waiting for MongoDB..."
                sleep 5
              done

              mongosh --host mongo-0.mongo:27017 --eval '
                rs.initiate({
                  _id: "rs0",
                  members: [
                    { _id: 0, host: "mongo-0.mongo:27017" },
                    { _id: 1, host: "mongo-1.mongo:27017" },
                    { _id: 2, host: "mongo-2.mongo:27017" }
                  ]
                })
              '