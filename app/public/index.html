
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan EMI Calculator</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container py-5">

    <div class="calculator-card mx-auto">

        <h1 class="text-center mb-2">Loan EMI Calculator</h1>
        <p class="text-center text-muted mb-4">
            Calculate your monthly loan instalment
        </p>

        <form id="emiForm">

            <div class="mb-3">
                <label class="form-label">Loan Amount (P)</label>
                <input
                    type="number"
                    class="form-control"
                    id="principal"
                    min="0.01"
                    step="any"
                    placeholder="Enter loan amount"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Annual Interest Rate (%)</label>
                <input
                    type="number"
                    class="form-control"
                    id="rate"
                    min="0.01"
                    step="any"
                    placeholder="Enter interest rate"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Tenure (Months)</label>
                <input
                    type="number"
                    class="form-control"
                    id="months"
                    min="1"
                    step="1"
                    placeholder="Enter months"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Calculate EMI
            </button>

        </form>

        <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>

        <div id="result" class="result-box mt-4 d-none">

            <h4 class="mb-3">Calculation Result</h4>

            <p>Monthly EMI:
                <strong id="emi"></strong>
            </p>

            <p>Total Payment:
                <strong id="totalPayment"></strong>
            </p>

            <p>Total Interest:
                <strong id="totalInterest"></strong>
            </p>

            <p>Served By:
                <strong id="servedBy"></strong>
            </p>

            <p>Pod IP:
                <strong id="podIp"></strong>
            </p>

        </div>

        <hr class="my-4">

        <h4 class="mb-3">Calculation History</h4>

        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>Principal</th>
                        <th>Rate</th>
                        <th>Months</th>
                        <th>EMI</th>
                        <th>Served By</th>
                    </tr>
                </thead>

                <tbody id="historyBody"></tbody>
            </table>
        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>

</body>
</html>
